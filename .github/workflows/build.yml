name: Build and Test

on:
  push:
    branches: [ main, master, develop, copilot/* ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t whisperfish-build .
    
    - name: Run store tests in container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          whisperfish-build \
          bash -c "go mod tidy && go test -v ./store/..."
    
    - name: Build store package in container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          whisperfish-build \
          go build -v ./store/...
    
    - name: Build model package in container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          whisperfish-build \
          go build -v ./model/...
    
    # Note: Full build with Qt bindings requires therecipe/qt tools
    # which are not available in this container due to Go version compatibility
    # See DOCKER.md for details
